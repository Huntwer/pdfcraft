name: Build Windows x64 + MCP CLI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows-x64-mcp.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 + MCP CLI
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download OCR models
        run: cargo xtask models

      - name: Build application
        run: cargo build --release --locked --package pdfcraft --target x86_64-pc-windows-msvc

      - name: Build MCP CLI
        run: cargo build --release --locked --package pdfcraft-cli --target x86_64-pc-windows-msvc

      - name: Verify executables
        shell: pwsh
        run: |
          $files = @(
            "target/x86_64-pc-windows-msvc/release/pdfcraft.exe",
            "target/x86_64-pc-windows-msvc/release/pdfcraft-cli.exe"
          )

          foreach ($exe in $files) {
            if (!(Test-Path $exe)) {
              throw "Executable not found: $exe"
            }

            $file = Get-Item $exe
            Write-Host "Executable: $($file.Name)"
            Write-Host "Size: $($file.Length) bytes"
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
            Write-Host "SHA256: $hash"
          }

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/pdfcraft.exe" artifact/
          Copy-Item "target/x86_64-pc-windows-msvc/release/pdfcraft-cli.exe" artifact/

      - name: Upload application and MCP CLI
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-x64-with-mcp
          path: artifact/
          if-no-files-found: error
          retention-days: 30
